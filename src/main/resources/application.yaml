server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: profile-service
              uri: lb://UserProfileMicroService
              predicates:
                - Path=/profile-service/**

            - id: auth-service
              uri: lb://AuthMicroService
              predicates:
                - Path=/auth/**
